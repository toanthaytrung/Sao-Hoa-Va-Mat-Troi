<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Thiên Thể: Quỹ Đạo Sao Hỏa & Trái Đất</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f43f5e, #fb923c, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    #viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas#mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bảng điều khiển kính mờ */
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .control-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 18px;
      width: 310px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }
    .panel-heading {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }
    .control-item label {
      display: block;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #f43f5e;
      cursor: pointer;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #e2e8f0;
      user-select: none;
    }
    .toggle-item input {
      accent-color: #f43f5e;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    button:hover {
      background: #475569;
    }
    button.btn-primary {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    /* Thông số thời gian thực */
    .metrics {
      background: rgba(2, 6, 23, 0.6);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-family: monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      margin-top: 4px;
    }
    .tag-pro { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .tag-opp { background: rgba(251, 191, 36, 0.25); color: #fbbf24; border: 1px solid #fbbf24; }
    .tag-retro { background: rgba(244, 63, 94, 0.25); color: #fb7185; border: 1px solid #fb7185; }

    /* Cửa sổ Sky View biểu kiến */
    .sky-widget {
      position: absolute;
      bottom: 20px;
      left: 20px;
      padding: 14px;
      width: 290px;
      z-index: 5;
    }
    .sky-widget-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    canvas#skyCanvas {
      width: 100%;
      height: 130px;
      background: #020617;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Hệ Quỹ Đạo Nhật Tâm: Trái Đất & Sao Hỏa</h1>
      <span class="badge">Kepler & Copernicus</span>
    </div>
    <div style="font-size: 0.85rem; color: #94a3b8;">Hiện tượng Trực Đối & Chuyển Động Nghịch Hành</div>
  </header>

  <div id="viewport">
    <canvas id="mainCanvas"></canvas>

    <!-- Hộp quan sát biểu kiến từ Trái Đất -->
    <div class="sky-widget glass-panel">
      <div class="sky-widget-header">
        <span>Góc nhìn biểu kiến từ Trái Đất</span>
        <span style="color:#f43f5e; font-size: 0.75rem;">Vệt Nghịch Hành</span>
      </div>
      <canvas id="skyCanvas" width="260" height="130"></canvas>
    </div>

    <!-- Bảng điều khiển bên phải -->
    <div class="control-panel glass-panel">
      <div class="panel-heading">Cấu hình mô phỏng</div>

      <div class="control-item">
        <label>Tốc độ thời gian (<span id="speedDisplay">1.0</span>x)</label>
        <div class="slider-container">
          <input type="range" id="speedSlider" min="0.1" max="4.0" step="0.1" value="1.0">
        </div>
      </div>

      <div class="control-item">
        <label>Độ lệch tâm Sao Hỏa e (<span id="eccDisplay">0.09</span>)</label>
        <div class="slider-container">
          <input type="range" id="eccSlider" min="0.0" max="0.4" step="0.01" value="0.09">
        </div>
      </div>

      <div class="toggle-item">
        <input type="checkbox" id="chkEarth" checked>
        <label for="chkEarth" style="cursor:pointer;">Quỹ đạo & Vị trí Trái Đất</label>
      </div>

      <div class="toggle-item">
        <input type="checkbox" id="chkSightline" checked>
        <label for="chkSightline" style="cursor:pointer;">Đường ngắm Trái Đất ➔ Sao Hỏa</label>
      </div>

      <div class="toggle-item">
        <input type="checkbox" id="chkSweep">
        <label for="chkSweep" style="cursor:pointer;">Cung quét diện tích (ĐL 2 Kepler)</label>
      </div>

      <div class="btn-group">
        <button id="btnPause" class="btn-primary">Tạm dừng</button>
        <button id="btnReset">Đặt lại</button>
      </div>

      <div class="panel-heading" style="margin-top: 4px;">Dữ liệu Động học</div>
      <div class="metrics">
        <div>Khoảng cách: <span id="valDist" style="color:#fff;">0.00</span> AU</div>
        <div>Vận tốc Hỏa: <span id="valVMars" style="color:#fb7185;">0.00</span> km/s</div>
        <div>Trạng thái:</div>
        <div id="badgeStatus" class="status-tag tag-pro">Thuận hành (Prograde)</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const skyCanvas = document.getElementById("skyCanvas");
    const skyCtx = skyCanvas.getContext("2d");

    const speedSlider = document.getElementById("speedSlider");
    const speedDisplay = document.getElementById("speedDisplay");
    const eccSlider = document.getElementById("eccSlider");
    const eccDisplay = document.getElementById("eccDisplay");
    const chkEarth = document.getElementById("chkEarth");
    const chkSightline = document.getElementById("chkSightline");
    const chkSweep = document.getElementById("chkSweep");
    const btnPause = document.getElementById("btnPause");
    const btnReset = document.getElementById("btnReset");
    const valDist = document.getElementById("valDist");
    const valVMars = document.getElementById("valVMars");
    const badgeStatus = document.getElementById("badgeStatus");

    // Tham số quỹ đạo
    const a_Earth = 1.0;
    const e_Earth = 0.0167;
    const a_Mars = 1.524;
    let e_Mars = 0.0934;
    const T_Mars_Ratio = 1.881; // Chu kỳ năm Sao Hỏa so với Trái Đất

    let M_Earth = 0;
    let M_Mars = Math.PI * 0.25;
    let isRunning = true;
    let timeScale = 1.0;

    const sightlines = [];
    const skyTrail = [];
    const stars = [];

    // Khởi tạo nền sao ngẫu nhiên
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Giải phương trình Kepler: M = E - e*sin(E)
    function solveKepler(M, ecc) {
      let E = M;
      for (let i = 0; i < 10; i++) {
        let delta = (E - ecc * Math.sin(E) - M) / (1 - ecc * Math.cos(E));
        E -= delta;
        if (Math.abs(delta) < 1e-6) break;
      }
      return E;
    }

    let prevAngle = null;
    let isRetrograde = false;

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Vẽ nền sao lấp lánh
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const scale = Math.min(canvas.width, canvas.height) / 4.3;

      // Tính hình học Ellipse
      const aE = a_Earth * scale;
      const bE = aE * Math.sqrt(1 - e_Earth * e_Earth);
      const cE = aE * e_Earth;

      const aM = a_Mars * scale;
      const bM = aM * Math.sqrt(1 - e_Mars * e_Mars);
      const cM = aM * e_Mars;

      // Mặt Trời là tiêu điểm gốc tại (centerX, centerY)
      const sunX = centerX;
      const sunY = centerY;

      if (isRunning) {
        const dM = 0.012 * timeScale;
        M_Earth = (M_Earth + dM) % (2 * Math.PI);
        M_Mars = (M_Mars + dM / T_Mars_Ratio) % (2 * Math.PI);
      }

      // Vị trí Trái Đất
      const EE = solveKepler(M_Earth, e_Earth);
      const nuE = 2 * Math.atan2(Math.sqrt(1 + e_Earth) * Math.sin(EE / 2), Math.sqrt(1 - e_Earth) * Math.cos(EE / 2));
      const rE = a_Earth * (1 - e_Earth * Math.cos(EE)) * scale;
      const earthX = sunX - rE * Math.cos(nuE);
      const earthY = sunY - rE * Math.sin(nuE);

      // Vị trí Sao Hỏa
      const EM = solveKepler(M_Mars, e_Mars);
      const nuM = 2 * Math.atan2(Math.sqrt(1 + e_Mars) * Math.sin(EM / 2), Math.sqrt(1 - e_Mars) * Math.cos(EM / 2));
      const rM_AU = a_Mars * (1 - e_Mars * Math.cos(EM));
      const rM = rM_AU * scale;
      const marsX = sunX - rM * Math.cos(nuM);
      const marsY = sunY - rM * Math.sin(nuM);

      // Tính khoảng cách & góc nhìn từ Trái Đất
      const dx = marsX - earthX;
      const dy = marsY - earthY;
      const dist_AU = Math.sqrt(dx * dx + dy * dy) / scale;
      const curAngle = Math.atan2(dy, dx);

      if (prevAngle !== null && isRunning) {
        let diff = curAngle - prevAngle;
        if (diff > Math.PI) diff -= 2 * Math.PI;
        if (diff < -Math.PI) diff += 2 * Math.PI;
        isRetrograde = diff < 0; // Đổi chiều góc quét biểu kiến
      }
      prevAngle = curAngle;

      const isOpposition = dist_AU < 0.65;

      if (isRunning && chkSightline.checked) {
        sightlines.push({ ex: earthX, ey: earthY, mx: marsX, my: marsY, retro: isRetrograde });
        if (sightlines.length > 130) sightlines.shift();

        skyTrail.push({ angle: curAngle, retro: isRetrograde });
        if (skyTrail.length > 320) skyTrail.shift();
      }

      // 2. Vẽ Quỹ Đạo
      if (chkEarth.checked) {
        ctx.beginPath();
        ctx.ellipse(sunX + cE, sunY, aE, bE, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.ellipse(sunX + cM, sunY, aM, bM, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(244, 63, 94, 0.35)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. Cung quét Kepler 2
      if (chkSweep.checked) {
        ctx.fillStyle = "rgba(244, 63, 94, 0.15)";
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        for (let i = 0; i <= 20; i++) {
          let sm = (M_Mars - 0.25 + 0.25 * (i / 20) + 2 * Math.PI) % (2 * Math.PI);
          let se = solveKepler(sm, e_Mars);
          let snu = 2 * Math.atan2(Math.sqrt(1 + e_Mars) * Math.sin(se / 2), Math.sqrt(1 - e_Mars) * Math.cos(se / 2));
          let sr = a_Mars * (1 - e_Mars * Math.cos(se)) * scale;
          ctx.lineTo(sunX - sr * Math.cos(snu), sunY - sr * Math.sin(snu));
        }
        ctx.closePath();
        ctx.fill();
      }

      // 4. Đường ngắm (Sightlines)
      if (chkSightline.checked && chkEarth.checked) {
        sightlines.forEach((l, idx) => {
          ctx.beginPath();
          ctx.moveTo(l.ex, l.ey);
          ctx.lineTo(l.mx, l.my);
          const alpha = (idx / sightlines.length) * 0.35;
          ctx.strokeStyle = l.retro ? `rgba(244, 63, 94, ${alpha * 1.5})` : `rgba(148, 163, 184, ${alpha})`;
          ctx.lineWidth = l.retro ? 1.5 : 0.8;
          ctx.stroke();
        });

        ctx.beginPath();
        ctx.moveTo(earthX, earthY);
        ctx.lineTo(marsX, marsY);
        ctx.strokeStyle = isRetrograde ? "#fb7185" : "#38bdf8";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 5. MẶT TRỜI
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 32);
      sunGlow.addColorStop(0, "#fbbf24");
      sunGlow.addColorStop(0.5, "#f59e0b");
      sunGlow.addColorStop(1, "transparent");
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fffbeb";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 11, 0, Math.PI * 2);
      ctx.fill();

      // 6. TRÁI ĐẤT
      if (chkEarth.checked) {
        const earthGlow = ctx.createRadialGradient(earthX, earthY, 4, earthX, earthY, 18);
        earthGlow.addColorStop(0, "rgba(56, 189, 248, 0.6)");
        earthGlow.addColorStop(1, "transparent");
        ctx.fillStyle = earthGlow;
        ctx.beginPath();
        ctx.arc(earthX, earthY, 18, 0, Math.PI * 2);
        ctx.fill();

        const earthBody = ctx.createRadialGradient(earthX - 2, earthY - 2, 1, earthX, earthY, 9);
        earthBody.addColorStop(0, "#93c5fd");
        earthBody.addColorStop(0.6, "#2563eb");
        earthBody.addColorStop(1, "#1e3a8a");
        ctx.fillStyle = earthBody;
        ctx.beginPath();
        ctx.arc(earthX, earthY, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "11px sans-serif";
        ctx.fillText("Trái Đất", earthX + 14, earthY + 4);
      }

      // 7. SAO HỎA (Thiết kế lớn, rực rỡ và sắc nét)
      const marsRadius = 13; // Kích thước to hơn
      const glowR = isOpposition ? 32 : 24;
      const marsGlow = ctx.createRadialGradient(marsX, marsY, 6, marsX, marsY, glowR);
      marsGlow.addColorStop(0, isOpposition ? "rgba(244, 63, 94, 0.85)" : "rgba(244, 63, 94, 0.5)");
      marsGlow.addColorStop(1, "transparent");
      ctx.fillStyle = marsGlow;
      ctx.beginPath();
      ctx.arc(marsX, marsY, glowR, 0, Math.PI * 2);
      ctx.fill();

      const marsBody = ctx.createRadialGradient(marsX - 3, marsY - 3, 2, marsX, marsY, marsRadius);
      marsBody.addColorStop(0, "#fda4af");
      marsBody.addColorStop(0.3, "#f43f5e");
      marsBody.addColorStop(0.7, "#be123c");
      marsBody.addColorStop(1, "#4c0519");
      ctx.fillStyle = marsBody;
      ctx.beginPath();
      ctx.arc(marsX, marsY, marsRadius, 0, Math.PI * 2);
      ctx.fill();

      // Chỏm băng cực
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.beginPath();
      ctx.arc(marsX - 2, marsY - marsRadius + 3.5, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fbcfe8";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("Sao Hỏa", marsX + 18, marsY + 4);

      // Cập nhật số liệu & trạng thái
      const mu = 132712440018;
      const rM_km = rM_AU * 149597870.7;
      const aM_km = a_Mars * 149597870.7;
      const vMars = Math.sqrt(mu * (2 / rM_km - 1 / aM_km));

      valDist.innerText = dist_AU.toFixed(3);
      valVMars.innerText = vMars.toFixed(2);

      if (isRetrograde) {
        badgeStatus.innerText = "⚡ Đang Nghịch Hành (Retrograde)";
        badgeStatus.className = "status-tag tag-retro";
      } else if (isOpposition) {
        badgeStatus.innerText = "🌟 Đang Trực Đối (Opposition)";
        badgeStatus.className = "status-tag tag-opp";
      } else {
        badgeStatus.innerText = "Thuận hành (Prograde)";
        badgeStatus.className = "status-tag tag-pro";
      }

      drawSky();
      requestAnimationFrame(render);
    }

    function drawSky() {
      skyCtx.clearRect(0, 0, skyCanvas.width, skyCanvas.height);
      const w = skyCanvas.width;
      const h = skyCanvas.height;

      skyCtx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      skyCtx.beginPath();
      skyCtx.moveTo(0, h / 2); skyCtx.lineTo(w, h / 2);
      skyCtx.stroke();

      if (skyTrail.length < 2) return;

      skyCtx.lineWidth = 2;
      for (let i = 0; i < skyTrail.length - 1; i++) {
        const p1 = skyTrail[i];
        const p2 = skyTrail[i + 1];

        const x1 = (w / 2) + p1.angle * 38;
        const y1 = (h / 2) + Math.sin(p1.angle * 2) * 22;
        const x2 = (w / 2) + p2.angle * 38;
        const y2 = (h / 2) + Math.sin(p2.angle * 2) * 22;

        skyCtx.beginPath();
        skyCtx.moveTo(x1, y1);
        skyCtx.lineTo(x2, y2);
        skyCtx.strokeStyle = p2.retro ? "#fb7185" : "#38bdf8";
        skyCtx.stroke();
      }

      const last = skyTrail[skyTrail.length - 1];
      if (last) {
        const lx = (w / 2) + last.angle * 38;
        const ly = (h / 2) + Math.sin(last.angle * 2) * 22;
        skyCtx.fillStyle = "#f43f5e";
        skyCtx.beginPath();
        skyCtx.arc(lx, ly, 5, 0, Math.PI * 2);
        skyCtx.fill();
      }
    }

    speedSlider.addEventListener("input", (e) => {
      timeScale = parseFloat(e.target.value);
      speedDisplay.innerText = timeScale.toFixed(1);
    });

    eccSlider.addEventListener("input", (e) => {
      e_Mars = parseFloat(e.target.value);
      eccDisplay.innerText = e_Mars.toFixed(2);
      sightlines.length = 0;
      skyTrail.length = 0;
    });

    btnPause.addEventListener("click", () => {
      isRunning = !isRunning;
      btnPause.innerText = isRunning ? "Tạm dừng" : "Tiếp tục";
      btnPause.className = isRunning ? "btn-primary" : "";
    });

    btnReset.addEventListener("click", () => {
      M_Earth = 0;
      M_Mars = Math.PI * 0.25;
      sightlines.length = 0;
      skyTrail.length = 0;
    });

    render();
  </script>
</body>
</html>
